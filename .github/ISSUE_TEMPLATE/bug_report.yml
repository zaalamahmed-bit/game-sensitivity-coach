name: Bug report
description: Report a reproducible problem with the skill or its tools.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Share only minimal, redacted information. Do not upload raw gameplay captures, private configurations, real saves, backups, account details, or credentials.
        For vulnerabilities, use [private reporting](https://github.com/DenisSergeevitch/game-sensitivity-coach/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: Which release tag or commit are you using?
      placeholder: Release tag or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include OS, Python version, agent host, and game/version if relevant. Include FFmpeg version for capture or export problems. Omit personal paths and account information.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reproducible example. Replace private paths with placeholders and use synthetic input instead of real configurations.
      placeholder: |
        1. Run this command with synthetic input...
        2. Observe...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what should happen and what happened instead. Include only the relevant redacted error excerpt.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already performed
      description: Optional. List relevant commands and outcomes, including skipped checks. Do not rerun a settings change just to gather a report; preserve any existing backup and receipt locally.
