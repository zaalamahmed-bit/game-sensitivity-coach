name: Synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test without live capture or game settings
        run: python -m unittest discover -s tests -v
      - name: Build distributable
        run: python scripts/package_release.py --output ../release/game-sensitivity-coach.zip
